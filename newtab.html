<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yeni Sekme</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input type="file" id="bg-uploader" accept="image/*" style="display: none;">

  <div id="toast-notification">Kopyalandı!</div>

  <div class="main-container">
    
    <div class="welcome-widget">
      <div class="widget-time-row">
        <h1 id="digital-clock">00:00</h1>
      </div>
    </div>

    <div class="tab-header">
      <button class="tab-btn">Home</button>
    </div>

    <div class="board-grid" id="board-grid">
    </div>
  </div>

  <div class="modal-overlay" id="link-modal">
    <div class="modal-content">
      <h3>Yeni Link Ekle</h3>
      <div class="input-group">
        <label>Görünecek İsim</label>
        <input type="text" id="site-name" placeholder="Örn: YouTube">
      </div>
      <div class="input-group">
        <label>Site URL Adresi</label>
        <input type="text" id="site-url" placeholder="Örn: youtube.com">
      </div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="close-modal">Vazgeç</button>
        <button class="modal-btn save" id="save-link">Ekle</button>
      </div>
    </div>
  </div>

  <!-- SAF SİYAH SAĞ ALT KONTROL PANELİ -->
  <div class="bottom-controls-stack" id="controls-container">
    <div class="menu-up-stack">
      <button class="circle-action-btn sub-btn" id="wallpaper-btn" title="Duvar Kağıdı Değiştir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>

      <button class="circle-action-btn sub-btn" id="streamer-mode-btn" title="Yayıncı Modu (Gizlilik)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>

      <button class="circle-action-btn sub-btn" id="import-btn" title="TXT Yedek Yükle (Import)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="14 10 12 12 10 10"></polyline>
          <line x1="12" y1="12" x2="12" y2="3"></line>
        </svg>
      </button>

      <button class="circle-action-btn sub-btn" id="export-btn" title="TXT Olarak Yedekle (Export)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
      </button>

      <button class="circle-action-btn sub-btn" id="copy-links-btn" title="Tüm Linkleri Kopyala">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
        </svg>
      </button>
    </div>

    <button class="circle-action-btn main-toggle" id="menu-toggle-btn" title="Menü">
      <div class="custom-menu-lines">
        <span class="line line-1"></span>
        <span class="line line-2"></span>
        <span class="line line-3"></span>
      </div>
      <svg class="close-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
